name: Bug report
description: Report a reproducible Fieldplay issue without private location data
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, platform and version
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Never include tokens, invite codes, exact GPS or private idea screenshots.
