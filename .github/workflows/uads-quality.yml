name: UADS source quality
on:
  pull_request:
    branches: [testing, beta, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uads-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/validate-uads.ts
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm run web:build
      - run: npx tsx scripts/landing-test.ts
        env:
          CHROME_PATH: /usr/bin/google-chrome
