name: Validate and build Fieldplay
on:
  workflow_dispatch:
    inputs:
      mobile:
        description: Build all four native formats (requires release signing secrets and runner budget)
        type: boolean
        default: false
  push:
    branches: [beta, main]
permissions:
  contents: read
concurrency:
  group: fieldplay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BUILD_COMMIT: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
      RELEASE_CHANNEL: ${{ github.ref_name == 'main' && 'stable' || github.ref_name == 'beta' && 'beta' || 'testing' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run web:build
      - name: Browser gameplay and PWA checks
        run: npm run test:browser && npm run test:design
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Validate native configuration without installing toolchains
        working-directory: apps/mobile
        run: |
          npx expo install --check
          npx expo prebuild --no-install
          npx expo-modules-autolinking resolve --platform android --json > ../../artifacts/autolinking.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: validation-${{ github.sha }}
          path: |
            artifacts/browser-results.json
            artifacts/design-results.json
            artifacts/screenshots
            artifacts/autolinking.json
            apps/mobile/dist
          retention-days: 14
  ios:
    if: github.event_name == 'push' || inputs.mobile
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [unsigned, simulator]
    env:
      BUILD_COMMIT: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
      RELEASE_CHANNEL: ${{ github.ref_name == 'main' && 'stable' || github.ref_name == 'beta' && 'beta' || 'testing' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/build-context.ts
      - name: Generate iOS project
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform ios --no-install
          pod install --project-directory=ios
      - name: Build and validate native artifact
        run: bash scripts/build-ios.sh '${{ matrix.variant }}'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-${{ matrix.variant }}-${{ github.sha }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14
  android:
    if: github.event_name == 'push' || inputs.mobile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        format: [apk, aab]
    env:
      BUILD_COMMIT: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
      RELEASE_CHANNEL: ${{ github.ref_name == 'main' && 'stable' || github.ref_name == 'beta' && 'beta' || 'testing' }}
      FIELDPLAY_KEYSTORE_BASE64: ${{ secrets.FIELDPLAY_KEYSTORE_BASE64 }}
      FIELDPLAY_STORE_PASSWORD: ${{ secrets.FIELDPLAY_STORE_PASSWORD }}
      FIELDPLAY_KEY_ALIAS: ${{ secrets.FIELDPLAY_KEY_ALIAS }}
      FIELDPLAY_KEY_PASSWORD: ${{ secrets.FIELDPLAY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - run: npm ci
      - run: npx tsx scripts/build-context.ts
      - name: Build with existing release identity
        run: bash scripts/build-android.sh '${{ matrix.format }}'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: android-${{ matrix.format }}-${{ github.sha }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14
  prepare-release:
    needs: [validate, ios, android]
    if: success() && github.ref_name != 'testing'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: ios-*
          path: artifacts/release
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: android-*
          path: artifacts/release
          merge-multiple: true
      - run: npm ci
      - run: npx tsx scripts/release-manifest.ts
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_CHANNEL: ${{ github.ref_name == 'main' && 'stable' || 'beta' }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: validated-release-${{ github.sha }}
          path: artifacts/release
          if-no-files-found: error
      # No publication step is enabled: no destination has publication authorization.
      # After explicit authorization, add a protected-environment publication job
      # consuming this complete validated collection, never partial build artifacts.
